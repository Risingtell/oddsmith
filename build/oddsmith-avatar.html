<!doctype html>
<meta charset="utf-8" />
<title>Oddsmith avatar - download PNG</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 20px;
         background: #0b1020; color: #c7d2fe; font: 15px/1.5 system-ui, sans-serif; }
  #wrap { display: grid; place-items: center; gap: 18px; padding: 32px; }
  /* No border-radius: OKX requires a hard 90-degree 1:1 image. The preview is
     square on purpose so what you see is exactly what gets uploaded. */
  svg { width: 280px; height: 280px; box-shadow: 0 12px 40px #0008; }
  button { background: #6366f1; color: #eef2ff; border: 0; border-radius: 10px;
           padding: 12px 22px; font-weight: 700; font-size: 15px; cursor: pointer; }
  button:hover { background: #818cf8; }
  small { opacity: .75; max-width: 340px; text-align: center; }
</style>
<div id="wrap">
  <!-- 1:1 Oddsmith mark: a decisive entry that rises to the price ceiling and
       stops there. The dashed line is the ceiling the desk refuses to chase past;
       the filled node is the fill. Discipline, drawn. -->
  <svg id="logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#312e81"/>
        <stop offset="1" stop-color="#0b1020"/>
      </linearGradient>
      <linearGradient id="stroke" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#6366f1"/>
        <stop offset="1" stop-color="#a5b4fc"/>
      </linearGradient>
    </defs>
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- the ceiling: never pay above it -->
    <line x1="96" y1="168" x2="416" y2="168" stroke="#a5b4fc" stroke-width="12"
          stroke-linecap="round" stroke-dasharray="34 26" opacity="0.85"/>

    <!-- the entry: rises decisively, stops exactly at the line -->
    <path d="M120 400 L216 304 L288 344 L376 208"
          fill="none" stroke="url(#stroke)" stroke-width="30"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- the fill -->
    <circle cx="376" cy="208" r="30" fill="#c7d2fe"/>
    <circle cx="376" cy="208" r="13" fill="#312e81"/>
  </svg>
  <button onclick="dl()">Download PNG (512x512)</button>
  <small>Saves <b>oddsmith.png</b>, square with hard corners. Upload that as the ASP avatar
  on OKX.AI. (Rounded corners get the listing flagged - that happened to Argus.)</small>
</div>
<script>
  function dl() {
    const svg = document.getElementById('logo');
    const xml = new XMLSerializer().serializeToString(svg);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, 512, 512);
      c.toBlob((b) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'oddsmith.png';
        a.click();
      }, 'image/png');
    };
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
  }
</script>
