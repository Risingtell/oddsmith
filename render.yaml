# Render blueprint - deploys Oddsmith as a persistent web service on the free plan.
#
# Oddsmith is native to X Layer: the service fee settles in USDt0 via x402, and
# execution is a real swap on the OKX DEX aggregator (X Layer). There is no
# external chain and no runtime binary - just Node + viem + signed OKX API calls -
# so hosting is unconstrained and no region requirement applies.
#
# EXECUTION_MODE defaults to "paper" so a fresh deploy never places a real swap
# until you flip it. Set the secrets in the Render dashboard; never commit them.
services:
  - type: web
    name: oddsmith
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXECUTION_MODE
        value: paper
      - key: MAX_STAKE_PER_TRADE_USD
        value: "1"
      - key: MAX_STAKE_PER_DAY_USD
        value: "5"
      - key: DEFAULT_SLIPPAGE_PERCENT
        value: "1"
      - key: MAX_SLIPPAGE_PERCENT
        value: "3"
      - key: XLAYER_RPC
        value: https://rpc.xlayer.tech
      # Secrets - set in the Render dashboard, never commit.
      - key: OKX_API_KEY
        sync: false
      - key: OKX_SECRET_KEY
        sync: false
      - key: OKX_PASSPHRASE
        sync: false
      - key: PAY_TO
        sync: false
      - key: MPP_MERCHANT_PRIVATE_KEY
        sync: false
      - key: MPP_SECRET_KEY
        sync: false
      - key: SPLIT_PARTNER
        sync: false
      - key: BUYER_PRIVATE_KEY
        sync: false
      - key: EXECUTION_PRIVATE_KEY
        sync: false
